name: pages
# Publishes main, and only main, to GitHub Pages. Work branches are reviewed from a local build.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
  # deploy-pages lists this run's artifacts; in a private repository that needs actions: read.
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run check -- --dist
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
      - id: deploy
        uses: actions/deploy-pages@v4
